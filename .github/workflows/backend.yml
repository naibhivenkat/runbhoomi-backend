name: RunBhoomi Backend CI

on:
  push:
    paths:
      - "runbhoomi_backend/**"
  pull_request:
    paths:
      - "runbhoomi_backend/**"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          cd runbhoomi_backend
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          echo "Add pytest tests later"

      - name: Build Docker Image
        run: |
          docker build -t runbhoomi-backend ./runbhoomi_backend